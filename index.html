<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaCleaner Pro - Offline Media Metadata Cleaner</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }
        h1 {
            font-size: 1.8rem;
            color: var(--accent);
            margin-bottom: 8px;
            text-align: center;
        }
        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        .drop-zone {
            border: 2px dashed var(--accent);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(56, 189, 248, 0.03);
        }
        .drop-zone:hover, .drop-zone.dragover {
            background: rgba(56, 189, 248, 0.1);
            border-color: #7dd3fc;
        }
        .drop-zone svg {
            width: 48px;
            height: 48px;
            fill: var(--accent);
            margin-bottom: 12px;
        }
        .drop-zone p {
            margin-bottom: 6px;
            font-size: 1rem;
        }
        .drop-zone span {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        input[type="file"] {
            display: none;
        }
        .options {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .options label:last-child {
            margin-bottom: 0;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: var(--accent);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover:not(:disabled) {
            background: var(--accent-hover);
            color: #fff;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #0f172a;
            font-size: 0.85rem;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 150px;
            overflow-y: auto;
            display: none;
        }
        .download-link {
            display: inline-block;
            margin-top: 15px;
            color: var(--success);
            text-decoration: none;
            font-weight: bold;
        }
        .download-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MetaCleaner Pro</h1>
        <p class="subtitle">Pembersih Metadata Media Offline (C2PA, EXIF, SEI NAL, Unicode)</p>
        
        <div class="drop-zone" id="dropZone">
            <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
            <p>Pilih atau seret file media ke sini</p>
            <span>Mendukung Video (MP4, MOV) & Gambar (JPG, PNG)</span>
            <input type="file" id="fileInput" accept="video/*,image/*">
        </div>

        <div class="options">
            <label><input type="checkbox" id="cleanExif" checked> Hapus EXIF & Metadata Standar</label>
            <label><input type="checkbox" id="cleanC2pa" checked> Strip C2PA / JUMBF Manifest</label>
            <label><input type="checkbox" id="cleanSei" checked> Filter SEI Bitstream NAL Units (H.264/H.265)</label>
            <label><input type="checkbox" id="cleanUnicode" checked> Bersihkan Karakter Unicode Tersembunyi</label>
        </div>

        <button class="btn" id="processBtn" disabled>Proses & Bersihkan File</button>

        <div class="status" id="statusBox"></div>
    </div>

    <script src="ffmpeg.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
